<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Compostaje - Huerto Escolar</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #81c784;
            --accent-color: #f57c00;
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            max-width: 650px;
            width: 100%;
            padding: 25px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            background-color: #e8f5e9;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .card {
            border: 3px solid var(--secondary-color);
            border-radius: 12px;
            padding: 20px;
            background-color: #fafafa;
            margin-bottom: 20px;
            position: relative;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-number {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1b5e20;
            margin-bottom: 10px;
        }

        .card-question {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 15px;
        }

        .reflection-prompt {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-weight: bold;
        }

        button:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        button.btn-no {
            background-color: #c62828;
        }

        button.btn-no:hover {
            background-color: #8e0000;
        }

        .feedback-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }

        .feedback-correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .feedback-reason {
            font-size: 0.95rem;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .mode-btn {
            padding: 15px;
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🌱 Juego del Compostaje Escolar</h1>
    <div class="subtitle">Aprende a clasificar los residuos para nuestro huerto</div>

    <!-- PANTALLA INICIAL / SELECCIÓN DE MODO -->
    <div id="start-screen">
        <p>Selecciona la modalidad de juego para comenzar:</p>
        <div class="mode-selection">
            <button class="mode-btn" onclick="startGame(5)">Modo Sencillo (5 Preguntas)</button>
            <button class="mode-btn" style="background-color: var(--accent-color);" onclick="startGame(10)">Modo Experto (10 Preguntas)</button>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-screen" class="hidden">
        <div class="score-board">
            <span id="progress-text">Pregunta 1 de 5</span>
            <span id="score-text">Puntos: 0</span>
        </div>

        <div class="card">
            <div class="card-number" id="card-num">1</div>
            <div class="card-title" id="card-title">Corteza de Naranja</div>
            <div class="card-question">¿Podemos echarla en la compostera?</div>
            <div class="reflection-prompt">💡 Tómate un momento para pensar antes de responder...</div>
        </div>

        <div id="action-buttons" class="btn-group">
            <button onclick="checkAnswer(true)">SÍ</button>
            <button class="btn-no" onclick="checkAnswer(false)">NO</button>
        </div>

        <div id="feedback-box" class="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div class="feedback-reason" id="feedback-reason"></div>
        </div>

        <div id="next-button-container" class="hidden" style="margin-top: 20px;">
            <button onclick="nextQuestion()">Siguiente Ficha ➔</button>
        </div>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="end-screen" class="hidden">
        <h2>🎉 ¡Juego Completado!</h2>
        <p id="final-score" style="font-size: 1.3rem; font-weight: bold; margin: 20px 0;"></p>
        <p id="final-message"></p>
        <button onclick="resetGame()" style="margin-top: 15px;">Jugar de nuevo</button>
    </div>
</div>

<script>
    // Banco de fichas extraídas del documento técnico de compostaje
    const cardsDatabase = [
        { id: 1, name: "Corteza de naranja", answer: true, category: "Cáscaras de fruta y verdura", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno. Sin abusar pues acidifican el suelo." },
        { id: 2, name: "Corteza de plátano", answer: true, category: "Cáscaras de fruta y verdura", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno." },
        { id: 3, name: "Corteza de piña", answer: true, category: "Cáscaras de fruta y verdura", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno." },
        { id: 4, name: "Restos de lechuga", answer: true, category: "Restos de verdura", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno." },
        { id: 5, name: "Restos de tomate", answer: true, category: "Restos de verdura", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno. Sin abusar pues acidifican el suelo." },
        { id: 6, name: "Papel de periódico", answer: false, category: "Papeles", detail: "CONTIENE TINTA. Los productos químicos de la tinta se añadirían al suelo." },
        { id: 7, name: "Papel de revista", answer: false, category: "Papeles", detail: "CONTIENE TINTA. Los productos químicos de la tinta se añadirían al suelo." },
        { id: 8, name: "Cáscara de huevo", answer: true, category: "Cáscaras de huevo", detail: "CONTIENE CALCIO. Ayudará al aporte de este mineral al compost." },
        { id: 9, name: "Restos de poda", answer: true, category: "Restos de poda", detail: "SON RESTOS SECOS. Ayudará al aporte de CARBONO." },
        { id: 10, name: "Restos de frutos secos", answer: true, category: "Frutos secos", detail: "SON RESTOS SECOS. Ayudará al aporte de CARBONO." },
        { id: 11, name: "Malezas", answer: false, category: "Plantas", detail: "PUEDEN CONTENER SEMILLAS. Estas semillas perduran tras el compostaje." },
        { id: 12, name: "Posos y restos del café", answer: true, category: "Restos de café", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno." },
        { id: 13, name: "Flores", answer: true, category: "Flores", detail: "SON RESTOS HÚMEDOS. Ricos en agua y nutrientes como el nitrógeno." },
        { id: 14, name: "Saquitos de té", answer: true, category: "Infusiones", detail: "FAVORECEN LA DESCOMPOSICIÓN. Siempre que se les quite el papel de la etiqueta por su tinta." },
        { id: 15, name: "Excrementos de perros y gatos", answer: false, category: "Residuos animales", detail: "BACTERIAS NOCIVAS. No utilizar heces de animales carnívoros u omnívoros." },
        { id: 16, name: "Pan", answer: false, category: "Alimentos procesados", detail: "PRODUCEN HONGOS. Las esporas de los hongos se repartirán por todo el huerto." },
        { id: 17, name: "Bollos", answer: false, category: "Alimentos procesados", detail: "PRODUCEN HONGOS. Las esporas de los hongos se repartirán por todo el huerto." },
        { id: 18, name: "Grasas", answer: false, category: "Aceites y grasas", detail: "PROVOCAN FALTA DE HUMEDAD. El agua y las grasas no se llevan bien." },
        { id: 19, name: "Aceite", answer: false, category: "Aceites y grasas", detail: "PROVOCA FALTA DE HUMEDAD. El agua y las grasas no se llevan bien." },
        { id: 20, name: "Restos de pescado", answer: false, category: "Carnes y pescados", detail: "ATRAEN MOSCAS. El huerto se llenaría de moscas de todas clases. No recomendable." },
        { id: 21, name: "Restos de carne", answer: false, category: "Carnes y pescados", detail: "ATRAEN MOSCAS. El huerto se llenaría de moscas de todas clases. No recomendable." },
        { id: 22, name: "Colillas de cigarrillo", answer: false, category: "Tóxicos", detail: "SUSTANCIAS TÓXICAS. Contienen más de 7.000 sustancias tóxicas, algunas cancerígenas." },
        { id: 23, name: "Cenizas de cigarrillo", answer: true, category: "Cenizas", detail: "ES UN ABONO ÚTIL. Aportan potasio y ayudan a combatir plagas y hongos." },
        { id: 24, name: "Leche", answer: false, category: "Lácteos", detail: "MALOS OLORES. Sus malos olores pueden atraer a insectos dañinos." },
        { id: 25, name: "Yogur", answer: false, category: "Lácteos", detail: "MALOS OLORES. Sus malos olores pueden atraer a insectos dañinos." },
        { id: 26, name: "Quesos", answer: false, category: "Lácteos", detail: "MALOS OLORES. Sus malos olores pueden atraer a insectos dañinos." },
        { id: 27, name: "Plásticos", answer: false, category: "Inorgánicos", detail: "SON INORGÁNICOS. Mejor al contenedor para su reciclaje." },
        { id: 28, name: "Fiambres", answer: false, category: "Carnes", detail: "ATRAEN MOSCAS. El huerto se llenaría de moscas. No recomendable." },
        { id: 29, name: "Metales", answer: false, category: "Inorgánicos", detail: "SON INORGÁNICOS. Mejor al contenedor para su reciclaje." },
        { id: 30, name: "Restos de pasta", answer: false, category: "Alimentos procesados", detail: "ATRAEN PLAGAS. Cualquier producto horneado o procesado atrae plagas." },
        { id: 31, name: "Serrín", answer: true, category: "Madera", detail: "MATERIA SECA. Sin abusar y siempre con maderas no tratadas ni de conglomerado." },
        { id: 32, name: "Césped cortado", answer: true, category: "Jardín", detail: "MATERIA HÚMEDA. Ricos en agua y nutrientes como el nitrógeno." },
        { id: 33, name: "Plumas", answer: true, category: "Otros orgánicos", detail: "MATERIA HÚMEDA. Ricas en nutrientes como el nitrógeno." },
        { id: 34, name: "Servilletas de papel", answer: true, category: "Papeles", detail: "MATERIA SECA. Siempre que no contenga tintas y sin abusar." },
        { id: 35, name: "Cartón", answer: true, category: "Papeles", detail: "MATERIA SECA. Siempre que no contenga tintas y sin abusar." },
        { id: 36, name: "Algodón", answer: true, category: "Textiles", detail: "MATERIA SECA. Siempre que sea algodón 100% y no contenga fibras sintéticas." },
        { id: 37, name: "Cabello", answer: true, category: "Otros orgánicos", detail: "MATERIA SECA. El pelo de las personas y mascotas es útil para hacer compost." },
        { id: 38, name: "Plantas enfermas", answer: false, category: "Jardín", detail: "CAUSAN ENFERMEDADES. Pueden seguir transmitiendo las enfermedades a las plantas del huerto." },
        { id: 39, name: "Tapones de corcho", answer: true, category: "Madera/Corcho", detail: "MATERIA SECA. Son restos orgánicos que favorecen la oxigenación." },
        { id: 40, name: "Lana", answer: true, category: "Textiles", detail: "MATERIA SECA. El pelo/lana animal es útil para hacer compost." }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let totalQuestions = 5;

    function startGame(questionsCount) {
        totalQuestions = questionsCount;
        score = 0;
        currentIndex = 0;
        
        // Seleccionar preguntas al azar sin repetición
        const shuffled = [...cardsDatabase].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, totalQuestions);

        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");

        showQuestion();
    }

    function showQuestion() {
        const card = currentQuestions[currentIndex];
        
        document.getElementById("progress-text").innerText = `Pregunta ${currentIndex + 1} de ${totalQuestions}`;
        document.getElementById("score-text").innerText = `Puntos: ${score}`;
        
        document.getElementById("card-num").innerText = card.id;
        document.getElementById("card-title").innerText = card.name;
        
        document.getElementById("action-buttons").classList.remove("hidden");
        document.getElementById("feedback-box").style.display = "none";
        document.getElementById("next-button-container").classList.add("hidden");
    }

    function checkAnswer(userChoice) {
        const card = currentQuestions[currentIndex];
        const isCorrect = (userChoice === card.answer);
        
        if (isCorrect) {
            score++;
        }

        document.getElementById("score-text").innerText = `Puntos: ${score}`;
        document.getElementById("action-buttons").classList.add("hidden");

        const feedbackBox = document.getElementById("feedback-box");
        const feedbackTitle = document.getElementById("feedback-title");
        const feedbackReason = document.getElementById("feedback-reason");

        feedbackBox.className = "feedback-box " + (isCorrect ? "feedback-correct" : "feedback-incorrect");
        feedbackTitle.innerText = isCorrect 
            ? `¡Correcto! Ficha ${card.id} Solución: ${card.answer ? "SÍ" : "NO"}` 
            : `¡Incorrecto! Ficha ${card.id} Solución correcta: ${card.answer ? "SÍ" : "NO"}`;
        
        feedbackReason.innerText = card.detail;
        feedbackBox.style.display = "block";

        document.getElementById("next-button-container").classList.remove("hidden");
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < totalQuestions) {
            showQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");

        const finalScoreElem = document.getElementById("final-score");
        const finalMsgElem = document.getElementById("final-message");

        finalScoreElem.innerText = `Has obtenido ${score} de ${totalQuestions} puntos.`;

        const percentage = (score / totalQuestions) * 100;
        if (percentage === 100) {
            finalMsgElem.innerText = "¡Excelente! Demuestras un dominio completo del compostaje. ¡Tus plantas del huerto escolar crecerán muy sanas!";
        } else if (percentage >= 60) {
            finalMsgElem.innerText = "¡Buen trabajo! Tienes claros los conceptos principales, aunque puedes seguir repasando las fichas explicativas.";
        } else {
            finalMsgElem.innerText = "¡Sigue practicando! Revisa bien las soluciones para aprender qué materiales aportan nutrientes y cuáles perjudican el compost.";
        }
    }

    function resetGame() {
        document.getElementById("end-screen").classList.add("hidden");
        document.getElementById("start-screen").classList.remove("hidden");
    }
</script>

</body>
</html>
